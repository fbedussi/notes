<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Flashcards</title>
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1 class="title">Note Flashcards</h1>
        <div class="stats">
          <div class="stat">
            <span class="score-label">Level</span>
            <span id="level" class="level">1</span>
          </div>
          <div class="stat">
            <span class="score-label">Score</span>
            <span id="score" class="score">0</span>
          </div>
        </div>
      </header>

      <section id="card" class="card">
        <svg
          id="staff"
          class="staff"
          viewBox="0 0 340 170"
          role="img"
          aria-label="Music staff showing a note"
        ></svg>
        <div id="timer" class="timer">
          <div id="timer-bar" class="timer-bar"></div>
        </div>
        <p id="feedback" class="feedback" aria-live="polite">Type the note name (A–G)</p>
      </section>

      <section id="keyboard" class="keyboard" aria-label="Answer keys"></section>

      <p class="help">
        Press the letter key matching the note before the timer runs out — +1 if right,
        −1 if wrong or out of time. Every 10 points: level up, 20% less time.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
