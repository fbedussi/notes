<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Flashcards</title>
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1 class="title">Note Flashcards</h1>
        <div class="score-wrap" aria-label="Score">
          <span class="score-label">Score</span>
          <span id="score" class="score">0</span>
        </div>
      </header>

      <section id="card" class="card">
        <svg
          id="staff"
          class="staff"
          viewBox="0 0 340 170"
          role="img"
          aria-label="Music staff showing a note"
        ></svg>
        <p id="feedback" class="feedback" aria-live="polite">Type the note name (A–G)</p>
      </section>

      <section id="keyboard" class="keyboard" aria-label="Answer keys"></section>

      <p class="help">Press the letter key matching the note on the staff — +1 if right, −1 if wrong.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
